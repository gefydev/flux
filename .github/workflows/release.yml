name: Release

on:
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: 'Publish packages to npm registry (@flow.engine)'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version & Release Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verification test suite
        run: bun test

      - name: Build 3D Game & WASM Assets
        run: bun run --cwd examples/space-shooter-3d build

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Flux Engine ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            examples/space-shooter-3d/public/physics_sim.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM (@flow.engine)
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_to_npm == true
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
