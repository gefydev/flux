name: 💡 Feature Request
description: Suggest an enhancement or new feature for Flux Engine.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that makes Flux Engine more productive, faster, or easier to use? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what problem you are trying to solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / API Design
      description: Describe the solution or how you envision the API behaving.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
