name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behavior in Flux Engine.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help reproduce and fix the bug.
  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      options:
        - "@flow.engine/core"
        - "@flow.engine/math"
        - "@flow.engine/ecs"
        - "@flow.engine/runtime"
        - "@flow.engine/wasm"
        - "CLI / Tooling"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Steps / Code
      description: Provide a minimal code snippet or repository demonstrating the issue.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Bun version, Node version, GPU model, Browser (if applicable).
      value: |
        - OS: 
        - Bun Version: 
        - Browser / Runtime: 
        - GPU: 
    validations:
      required: true
